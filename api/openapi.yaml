openapi: 3.1.0
info:
  title: קוד פתוח ישראל API
  version: 1.0.0
  description: Public JSON API for the Open Source Israel project directory.
servers:
  - url: https://YOUR-WORKER.workers.dev/api/v1
    description: Replace with the deployed Worker URL
paths:
  /health:
    get:
      summary: API health
      responses:
        '200':
          description: Service status
  /categories:
    get:
      summary: List categories
      responses:
        '200':
          description: Categories
  /projects:
    get:
      summary: List published projects
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: category
          schema: { type: string }
      responses:
        '200':
          description: Projects and pagination
    post:
      summary: Submit a project (OAuth implementation pending)
      security: [{ bearerAuth: [] }]
      responses:
        '401':
          description: Authentication required
        '501':
          description: Not enabled in initial release
  /projects/{id}:
    get:
      summary: Get a published project
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Project details }
        '404': { description: Project not found }
  /search:
    get:
      summary: Search published projects
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 2, maxLength: 100 }
      responses:
        '200': { description: Search results }
  /users/{id}:
    get:
      summary: Get a public user profile
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Public user profile }
  /releases/{id}:
    get:
      summary: Get release details and download assets
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Release and assets }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
